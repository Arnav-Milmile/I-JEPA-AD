[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ijepa-ad"
version = "0.1.0"
description = "Decoder-free latent anomaly detection with I-JEPA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pillow>=10.1,<13", "torch>=2.2,<3"]

[project.optional-dependencies]
dev = [
    "black==25.1.0",
    "mypy==1.14.1",
    "pre-commit==4.0.1",
    "pytest==8.3.4",
    "ruff==0.8.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "skip"
ignore_missing_imports = true
disallow_subclassing_any = false
files = ["src", "tests"]
packages = ["ijepa_ad"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra"
pythonpath = ["src"]
