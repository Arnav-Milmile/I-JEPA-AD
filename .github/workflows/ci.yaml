name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,frontend]"
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check --workers 1 .
      - name: Mypy
        run: mypy src tests
      - name: Unit and integration tests
        run: pytest tests/unit tests/integration
